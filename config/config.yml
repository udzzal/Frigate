#==================================================
# FRIGATE CONFIG (0.17 / 0.18)
# এই ফাইল সেভ করুন: ./config/config.yml
# =========================================================
 
mqtt:
  host: mosquitto
  port: 1883
 
detectors:
  cpu:
    type: cpu
 
cameras:
  front_camera:
    ffmpeg:
      inputs:
        # IP ও পাসওয়ার্ড docker-compose.yml-এর environment থেকে আসে
        # - path: rtsp://admin:Cam%402015@103.120.202.59:554/Preview_01_sub
        #   roles:
        #     - detect
        #     - record
        # ভালো কোয়ালিটির রেকর্ডিং চাইলে নিচের ৪ লাইন চালু করুন
        # এবং উপরের input থেকে `- record` সরিয়ে দিন:
          - path: rtsp://admin:Cam%402015@103.120.202.59:554/Preview_01_main
            roles:
              - record
 
    detect:
      width: 640
      height: 360
      fps: 5
 
    objects:
      track:
        - person
        - car
 
    motion:
      threshold: 30
      contour_area: 10
      improve_contrast: true
 
    zones:
      front_door:
        # detect ফ্রেম (640x360) অনুযায়ী পিক্সেল; পরে UI থেকে এঁকে নিন
        coordinates: 100,100,500,100,500,300,100,300
        objects:
          - person
 
    record:
      enabled: true
      continuous:
        days: 0
      motion:
        days: 7
      alerts:
        retain:
          days: 14
      detections:
        retain:
          days: 14
 
    snapshots:
      enabled: true
      timestamp: true
      bounding_box: true
      retain:
        default: 14
 
    audio:
      enabled: false
 
objects:
  track:
    - person
    - car
 
birdseye:
  enabled: true
  mode: continuous
 
live:
  height: 720
 
version: 0.18-0
 