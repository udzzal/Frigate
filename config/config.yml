# =========================================================
# FRIGATE CONFIGURATION
# =========================================================


# =========================================================
# 1. MQTT
# =========================================================

mqtt:
  host: mosquitto
  port: 1883


# =========================================================
# 2. DETECTOR
# =========================================================

detectors:
  cpu:
    type: cpu


# =========================================================
# 3. CAMERA
# =========================================================

cameras:

  front_camera:

    # -----------------------------------------------------
    # 3.1 VIDEO INPUT
    # -----------------------------------------------------

    ffmpeg:
      inputs:

        - path: rtsp://admin:Cam%402015@103.120.202.59:554/Preview_01_sub
          roles:
            - detect
            - record


    # -----------------------------------------------------
    # 3.2 OBJECT DETECTION
    # -----------------------------------------------------

    detect:
      width: 640
      height: 360
      fps: 5


    # -----------------------------------------------------
    # 3.3 OBJECT TRACKING
    # -----------------------------------------------------

    objects:
      track:
        - person
        - car


    # -----------------------------------------------------
    # 3.4 MOTION DETECTION
    # -----------------------------------------------------

    motion:
      threshold: 30
      contour_area: 10
      improve_contrast: true


    # -----------------------------------------------------
    # 3.5 ZONE
    # -----------------------------------------------------

    zones:

      front_door:
        coordinates: 100,100,500,100,500,300,100,300
        objects:
          - person


    # -----------------------------------------------------
    # 3.6 RECORDING
    # -----------------------------------------------------

    record:
      enabled: true

      retain:
        days: 7
        mode: motion

      events:
        retain:
          default: 14
          mode: motion


    # -----------------------------------------------------
    # 3.7 SNAPSHOTS
    # -----------------------------------------------------

    snapshots:
      enabled: true
      clean_copy: true
      timestamp: true
      bounding_box: true

      retain:
        default: 14


    # -----------------------------------------------------
    # 3.8 AUDIO
    # -----------------------------------------------------

    audio:
      enabled: true


# =========================================================
# 4. GLOBAL OBJECTS
# =========================================================

objects:
  track:
    - person
    - car


# =========================================================
# 5. BIRDSEYE
# =========================================================

birdseye:
  enabled: true
  mode: continuous


# =========================================================
# 6. LIVE VIEW
# =========================================================

live:
  height: 720


# =========================================================
# 7. VERSION
# =========================================================

version: 0.16


